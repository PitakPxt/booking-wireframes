<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Wireframes</title>
<style>
  :root { --bg: #f4f4f5; --panel: #ffffff; --ink: #1f1f1f; --ink-2: #5c5c5c; --line: #e2e2e4; --accent: #2f6fed; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Sukhumvit Set", "Thonburi", "Noto Sans Thai", -apple-system, sans-serif; line-height: 1.5; }
  .top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 20px 24px; }
  .top h1 { font-size: 24px; }
  .top p { color: var(--ink-2); font-size: 15px; margin-top: 2px; }
  .wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; max-width: 1560px; margin: 0 auto; padding: 24px; }
  nav { position: sticky; top: 16px; align-self: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  nav ul { list-style: none; }
  nav .sec { margin-bottom: 12px; }
  nav .sec > a { font-weight: 700; font-size: 15px; }
  nav .sec ul { margin-top: 4px; }
  nav .sec li a { display: block; font-size: 14px; color: var(--ink-2); padding: 3px 0 3px 10px; border-left: 2px solid var(--line); }
  nav a { color: var(--ink); text-decoration: none; }
  nav a:hover { color: var(--accent); }
  section { margin-bottom: 40px; }
  .sec-head { margin: 4px 0 16px; }
  .sec-head h2 { font-size: 22px; }
  .sec-head p { color: var(--ink-2); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; scroll-margin-top: 16px; }
  .card h3 { font-size: 18px; }
  .card p { color: var(--ink-2); font-size: 15px; margin-bottom: 12px; }
  .hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; padding: 16px; }
    nav { position: static; max-height: none; }
  }

/* M1 live mockup: all interactive UI is native HTML; only the vehicle illustration is an image. */
#m-select { --m1-accent:#222; --m1-ink:#222; --m1-muted:#666; --m1-line:#e2e2e4; --m1-soft:#f3f3f3; --m1-focus:#2c65c2; }
#m-select .m1-actions { display:flex; justify-content:flex-end; margin:0 0 16px; }
#m-select button, #m-select select { font:inherit; }
#m-select button { cursor:pointer; }
#m-select button:disabled { cursor:default; opacity:.45; }
#m-select :focus-visible { outline:3px solid var(--m1-focus); outline-offset:3px; }
.m1-expand, .m1-close { min-height:44px; padding:10px 16px; border:1px solid #c5c6d2; border-radius:8px; background:#fff; color:#222; }
.m1-composite { width:100%; container-name:m1-board; container-type:inline-size; }
.m1-live-board { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(200px,.62fr); gap:24px; padding:24px; background:#e9eaec; color:var(--m1-ink); font-family:"Noto Sans Thai","Sukhumvit Set","Thonburi",sans-serif; }
.m1-live-board * { box-sizing:border-box; }
.m1-live-board h4 { margin:0 0 12px; font-size:16px; font-weight:700; line-height:1.6; }
.m1-live-screen { container-name:m1-screen; container-type:inline-size; display:flex; flex-direction:column; height:1060px; min-width:0; overflow:hidden; background:#fff; border:1px solid var(--m1-line); }
.m1-appbar { flex:none; display:flex; justify-content:space-between; align-items:center; min-height:60px; padding:8px 20px; background:#d8d8d8; }
.m1-back { display:flex; align-items:center; gap:4px; font-size:14px; }
.m1-back svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; }
.m1-steps { flex:none; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; padding:16px 8px; list-style:none; border-bottom:1px solid var(--m1-line); }
.m1-steps li { min-width:0; display:flex; align-items:center; flex-direction:column; gap:6px; color:var(--m1-muted); text-align:center; font-size:12px; }
.m1-steps li span { position:relative; z-index:1; display:grid; place-items:center; flex:none; width:28px; height:28px; padding:0; font-size:12px; font-weight:400; border:1px solid #c7c7c7; border-radius:50%; background:#fff; color:#888; }
.m1-steps [aria-current="step"] { color:var(--m1-ink); font-weight:700; }
.m1-steps [aria-current="step"] span { background:#fff; border:2px solid var(--m1-accent); color:var(--m1-ink); font-weight:700; }
.m1-hero { flex:none; padding:12px 20px 16px; text-align:center; background:#fff; border-bottom:1px solid var(--m1-line); }
.m1-queue-refresh { display:flex; justify-content:flex-end; align-items:center; gap:8px; min-height:44px; }
.m1-queue-refresh button { min-height:44px; padding:0 12px; border:1px solid #aaa; border-radius:999px; background:#fff; color:var(--m1-ink); font:inherit; font-size:13px; cursor:pointer; }
.m1-vehicle { display:block; width:min(88%,500px); height:160px; margin:0 auto; object-fit:contain; }
.m1-model-name { margin:2px 0 4px; font-size:24px; font-weight:700; line-height:1.5; color:var(--m1-ink); }
.m1-color-picker { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; }
.m1-color-button { flex:none; position:relative; display:grid; place-items:center; width:44px; height:44px; border:2px solid transparent; border-radius:50%; background:#fff; padding:3px; }
.m1-color-button[aria-pressed="true"] { border-color:var(--m1-accent); }
.m1-color-dot { display:block; width:32px; height:32px; border:1px solid #999; border-radius:50%; background:var(--swatch); }
.m1-color-name { margin:0 0 10px; font-size:16px; font-weight:700; line-height:1.6; color:var(--m1-ink); }
.m1-color-surcharge { display:inline-block; margin-inline-start:8px; color:var(--m1-muted); font-size:14px; white-space:nowrap; }
.m1-state-scrolled .m1-vehicle { height:116px; }
.m1-state-scrolled .m1-model-name { font-size:22px; }
.m1-content { margin-bottom:0; flex:1; min-height:0; overflow:auto; padding:20px; background:var(--m1-soft); scrollbar-color:#c7c7c7 transparent; scrollbar-width:thin; }
.m1-field { margin:0 0 20px; }
.m1-field > label, .m1-insurance legend { display:block; padding:0; margin:0 0 8px; font-size:15px; font-weight:700; line-height:1.6; }
.m1-dropdown { position:relative; min-height:48px; border:1px solid #dcdcdc; border-radius:12px; background:#fff; }
.m1-dropdown:focus-within { outline:3px solid var(--m1-focus); outline-offset:2px; }
.m1-selected { display:flex; align-items:center; gap:10px; min-height:48px; padding:10px; font-size:14px; line-height:1.6; }
.m1-code { flex:none; padding:2px 8px; border:1px solid #dcdcdc; border-radius:12px; background:#f0f0f0; font-size:12px; }
.m1-option-name { flex:1; min-width:0; }
.m1-submodel-price { flex:none; font-size:13px; font-variant-numeric:tabular-nums; }
.m1-selected svg { width:16px; height:16px; flex:none; fill:none; stroke:#777; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.m1-dropdown select { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; }
.m1-dropdown .m1-selected { width:100%; border:0; border-radius:inherit; background:#fff; color:inherit; font-family:inherit; text-align:left; cursor:pointer; }
.m1-queue { margin:0 0 24px; }
.m1-queue-header { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:12px; }
.m1-queue-header h5 { font-size:16px; margin:0; line-height:1.6; }
.m1-sample { font-size:12px; color:var(--m1-muted); }
.m1-queue table { width:100%; table-layout:fixed; border-collapse:collapse; border:1px solid #d9dce5; background:#fff; font-size:14px; }
.m1-queue th { position:sticky; top:0; z-index:1; padding:10px 8px; border-bottom:1px solid #d9dce5; font-size:13px; color:#12284e; font-weight:700; text-align:center; background:#eef0f5; }
.m1-queue th:first-child { width:48%; text-align:left; }
.m1-queue td { height:48px; padding:10px 8px; text-align:center; border-bottom:1px solid var(--m1-line); font-variant-numeric:tabular-nums; }
.m1-queue th + th,.m1-queue td + td { border-left:1px solid #d9dce5; }
.m1-queue td:first-child { text-align:left; }
.m1-queue-row.is-selected { background:#e9e9e9; color:var(--m1-ink); font-weight:700; }
.m1-queue-color { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.m1-queue-dot { flex:none; width:14px; height:14px; border:1px solid #999; border-radius:50%; background:var(--swatch); }
.m1-row-label { min-width:0; }
.m1-row-selected { display:none; font-size:11px; color:var(--m1-accent); white-space:nowrap; }
.is-selected .m1-row-selected { display:inline; }
.m1-insurance { margin:0 0 12px; padding:0; border:0; }
.m1-insurance-choices { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
.m1-insurance-choice { display:flex; align-items:center; gap:8px; min-height:44px; margin:0; padding:0 12px; border:1px solid var(--m1-line); border-radius:8px; background:#fff; font-size:14px; cursor:pointer; }
.m1-insurance-choice:has(input:checked) { background:#e9e9e9; border-color:var(--m1-accent); }
.m1-insurance-choice input { accent-color:var(--m1-accent); width:18px; height:18px; }
.m1-insurance-class select { width:100%; min-height:48px; padding:10px 12px; border:1px solid #dcdcdc; border-radius:12px; background:#fff; color:var(--m1-ink); font-size:16px; }
.m1-required-hint { margin-top:6px; font-size:13px; color:#8e3b00; }
.m1-footer { flex:none; display:grid; grid-template-columns:minmax(92px,.65fr) minmax(0,1.35fr) minmax(88px,.9fr); align-items:center; gap:12px; padding:16px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); background:#fff; border-top:1px solid var(--m1-line); }
.m1-footer-label { display:block; margin-bottom:4px; font-size:11px; color:var(--m1-muted); }
.m1-money { display:block; font-size:clamp(15px,2.45cqw,18px); line-height:1.5; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.m1-quantity { display:flex; align-items:center; justify-content:flex-end; gap:12px; }
.m1-quantity button { width:44px; height:44px; padding:0; border:0; border-radius:22px; background:#f1f1f1; color:var(--m1-ink); font-size:22px; }
.m1-quantity output { font-size:16px; font-weight:700; min-width:20px; text-align:center; }
.m1-next { min-height:52px; padding:12px 14px; border:0; border-radius:8px; background:var(--m1-accent); color:#fff; font-size:16px; font-weight:700; }
.m1-feedback { grid-column:1/-1; font-size:12px; color:var(--m1-accent); }
.m1-feedback:empty { display:none; }
.m1-notes { padding:20px; background:#fff; border-radius:12px; align-self:start; font-size:14px; line-height:1.8; }
.m1-notes ul { margin:0; padding-left:20px; }
.m1-notes li+li { margin-top:12px; }
.m1-notes .m1-notes-data { margin-top:20px; padding-top:16px; border-top:1px solid var(--m1-line); color:var(--m1-muted); }
#m1-dialog { position:fixed; inset:0; width:100vw; height:100dvh; max-width:none; max-height:none; margin:0; padding:0; border:0; background:#e9eaec; overflow:auto; }
#m1-dialog::backdrop { background:rgba(20,20,22,.9); }
.m1-dialog-toolbar { position:sticky; top:0; left:0; z-index:2; display:flex; justify-content:space-between; align-items:center; width:100vw; min-height:64px; padding:8px 16px; border-bottom:1px solid #dcdcdc; background:#fff; font-weight:700; }
#m1-dialog-content .m1-composite { width:min(100%,2120px); }
@container m1-board (max-width:1100px) { .m1-live-board { grid-template-columns:repeat(2,minmax(0,1fr)); padding:16px; gap:16px; } .m1-notes { grid-column:1/-1; } .m1-live-screen { height:1060px; } .m1-submodel-price { display:none; } .m1-selected { gap:6px; } .m1-content { padding:16px; } }
@container m1-board (max-width:650px) { .m1-live-board { grid-template-columns:minmax(0,1fr); padding:12px; gap:24px; } .m1-notes { grid-column:auto; } .m1-vehicle { height:145px; } .m1-model-name { font-size:22px; } }
@container m1-board (max-width:350px) { .m1-color-picker { gap:12px; } .m1-live-board { padding:0; } .m1-content { padding:14px; } .m1-hero { padding:10px 14px; } .m1-appbar { padding:8px 14px; } .m1-queue th:first-child { width:40%; } .m1-queue td,.m1-queue th { padding-left:6px; padding-right:6px; } }
@media (forced-colors:active) { .m1-dropdown select { opacity:1; } }

/* M2 visual language; all section geometry and content order stay unchanged. */
.m1-steps li { position:relative; }
.m1-steps li:not(:last-child)::after { content:""; position:absolute; top:14px; left:calc(50% + 14px); width:calc(100% - 24px); height:1px; background:#d3d3d3; pointer-events:none; }
.m1-queue-row.is-selected td { box-shadow:inset 0 1px #ccc,inset 0 -1px #ccc; }

/* Footer follows V4: unit price | total (quantity) | rectangular next action. */
.m1-total-block { min-width:0; padding-left:16px; border-left:1px solid var(--m1-line); }
.m1-footer:has(.m1-total-block[hidden]) { grid-template-columns:minmax(0,2fr) minmax(88px,.9fr); }
.m1-total-block .m1-money { font-size:clamp(18px,3.2cqw,24px); }
.m1-quantity-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid var(--m1-line); font-size:15px; font-weight:700; }
@container m1-screen (max-width:359px) { .m1-footer { grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:12px; padding:12px; } .m1-next { grid-column:1/-1; min-height:44px; } .m1-total-block { padding-left:12px; } }

/* Responsive comparison keeps each frame readable without sideways scrolling. */
.m1-composite { width:100%; max-width:100%; }
.m1-live-board { grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); width:100%; gap:16px; padding:16px; }
.m1-live-board .m1-state,.m1-reference-state { width:100%; min-width:0; margin-bottom:0; }
.m1-live-board .m1-live-screen { width:100%; height:1060px; }
.m1-live-board .m1-notes { grid-column:auto; width:auto; }
.m1-reference-frame { width:100%; max-width:744px; background:#fff; outline:1px solid #e2e2e4; }
.m1-reference-frame img { display:block; width:100%; height:auto; }
.m1-reference-source { margin-top:10px; font-size:13px; color:#666; }
.m1-comparison-hint { margin:0 0 12px; color:#666; font-size:13px; }
#m1-inline .m1-live-board { zoom:.6; grid-template-columns:repeat(2,minmax(0,744px)); }
@container m1-board (max-width:580px) {
  #m1-inline .m1-live-board { grid-template-columns:minmax(0,744px); }
}
#m1-inline .m1-reference-frame { max-width:none; }
#m1-inline .m1-live-screen { height:auto; aspect-ratio:744 / 1060; min-height:620px; }
#m1-inline .m1-vehicle { width:min(96%,600px); height:180px; }
#m1-inline .m1-state-scrolled .m1-vehicle { height:145px; }
nav .sec > a.is-current { color:#2c65c2; }
nav a[aria-current="location"] { background:#e9eff9; color:#12284e; border-radius:4px; font-weight:700; }
nav .sec li a[aria-current="location"] { border-left-color:#2c65c2; }

/* M2 equipment wireframe */
#m-acc { --m1-ink:#222; --m1-muted:#666; --m1-line:#e2e2e4; --m1-accent:#222; }
#m-acc { container-type:inline-size; }
/* M3 live mockup: step 4, booking details. */
#pay-deposit { --m1-ink:#222; --m1-muted:#666; --m1-line:#e2e2e4; --m1-accent:#222; }
#pay-deposit :focus-visible { outline:2px solid #2c65c2; outline-offset:3px; }
.m3-live { display:grid; grid-template-columns:minmax(0,744px) minmax(0,560px); justify-content:start; align-items:start; gap:16px; margin-bottom:16px; padding:16px; zoom:.6; background:#e9eaec; color:#222; }
.m3-live h4 { margin:0 0 12px; font-size:16px; line-height:1.6; }
.m3-live section { min-width:0; margin:0; }
.m3-screen .m1-steps li:nth-child(-n+3) span { border-color:#222; background:#222; color:#fff; }
.m3-screen [hidden] { display:none; }
.m3-fieldset { border:0; }
.m3-fieldset legend { float:left; width:100%; margin:0 0 8px; padding:0; font-size:16px; font-weight:700; }
.m3-fieldset > :not(legend) { clear:both; }
.m3-seg { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; padding:4px; border-radius:10px; background:#e2e2e2; }
.m3-seg label { position:relative; display:grid; place-items:center; min-height:44px; border-radius:7px; color:#555; cursor:pointer; }
.m3-seg input { position:absolute; opacity:0; }
.m3-seg label:has(input:checked) { background:#fff; color:#222; font-weight:700; }
.m3-seg label:has(input:focus-visible) { outline:2px solid #2c65c2; outline-offset:2px; }
.m3-rate { display:flex; align-items:center; gap:10px; }
.m3-unit { display:flex; align-items:center; min-height:52px; padding-right:12px; border:1px solid #aaa; border-radius:10px; background:#fff; color:#555; }
.m3-unit input { width:84px; min-height:50px; padding:8px 6px 8px 12px; border:0; background:transparent; color:#222; font:inherit; text-align:right; }
.m3-unit-amount input { width:124px; }
#pay-deposit .m3-unit input:focus-visible { outline:0; }
.m3-unit:focus-within { outline:2px solid #2c65c2; outline-offset:2px; }
.m3-unit:has(input[aria-invalid="true"]) { border-color:#b42318; box-shadow:0 0 0 1px #b42318; }
.m3-unit:has(input:disabled) { background:#f2f2f2; color:#999; }
.m3-unit input:disabled { color:#999; }
.m3-or { color:#666; font-size:14px; }
.m3-seg label:has(input:disabled) { color:#aaa; cursor:default; }
.m3-kv i { color:#b42318; font-style:normal; }
.m3-screen .m3-rate-hint { margin:0; color:#666; font-size:13px; text-align:right; }
.m3-screen .m3-rate-error { margin:0; text-align:right; }
.m3-field { display:grid; gap:4px; margin-top:12px; font-size:14px; }
.m3-field i { color:#b42318; font-style:normal; }
.m3-field select,.m3-field input { width:100%; min-width:0; min-height:44px; padding:8px 10px; border:1px solid #aaa; border-radius:8px; background:#fff; color:inherit; font:inherit; }
.m3-row { display:flex; align-items:center; gap:12px; min-height:56px; border-bottom:1px solid var(--m1-line); font-size:15px; }
.m3-row input,.m3-radios input,.m3-check input { flex:none; width:18px; height:18px; accent-color:#222; }
.m3-row small { display:block; color:#666; font-size:12px; }
.m3-row > :last-child { margin-left:auto; }
.m3-tag { padding:2px 8px; border-radius:999px; background:#efeff4; color:#595c79; font-size:11px; white-space:nowrap; }
.m3-req { background:#222; color:#fff; }
.m3-radios { display:flex; flex-wrap:wrap; gap:0 28px; margin-top:4px; font-size:15px; }
.m3-radios label,.m3-check { display:flex; align-items:center; gap:8px; min-height:44px; cursor:pointer; }
.m3-radios label:has(input:disabled) { color:#aaa; cursor:default; }
.m3-screen .m3-error { margin:4px 0 0; color:#b42318; font-size:13px; }
.m3-screen .m3-empty { margin:0; color:#666; font-size:14px; }
.m3-kv { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; font-size:15px; font-variant-numeric:tabular-nums; }
.m3-big { margin-top:6px; padding-top:10px; border-top:1px solid var(--m1-line); font-size:17px; font-weight:700; }
.m3-check { font-size:15px; }
.m3-screen { position:relative; }
.m3-fieldset legend i,.m3-pay-heading i,.m3-field > span i { color:#b42318; font-style:normal; }
.m3-vehicle { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.m3-vehicle b { color:#222; }
.m3-vehicle-img { flex:none; display:grid; place-items:center; width:112px; height:64px; border:1px dashed #aaa; border-radius:8px; background:#eee; color:#888; font-size:12px; }
.m3-pay-block { margin-top:14px; }
.m3-pay-heading { margin:0 0 4px; font-size:14px; font-weight:700; }
.m3-pay-list { list-style:none; margin:0; padding:0; }
.m3-pay-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--m1-line); font-variant-numeric:tabular-nums; }
.m3-pay-tag { display:grid; place-items:center; width:40px; height:40px; border-radius:8px; background:#eee; color:#555; font-size:12px; }
.m3-pay-row strong { display:block; font-size:15px; }
.m3-pay-row small { display:block; color:#666; font-size:12px; }

.m1-hold { font-variant-numeric:tabular-nums; }
.m1-appbar .m1-heat-info { display:grid; place-items:center; width:44px; height:44px; margin:-4px -10px -4px 0; padding:0; border:0; background:transparent; color:inherit; }
.m1-appbar .m1-heat-info span { display:grid; place-items:center; width:24px; height:24px; border:1.5px solid currentColor; border-radius:50%; font-family:Georgia,"Times New Roman",serif; font-size:15px; font-weight:700; font-style:italic; line-height:1; }
.m1-heat-tip { position:absolute; top:58px; right:10px; z-index:4; display:grid; gap:12px; width:min(320px,calc(100% - 20px)); padding:14px 16px; border:1px solid #c9c9c9; border-radius:12px; background:#fff; box-shadow:0 8px 24px #0003; color:var(--m1-ink); text-align:left; }
.m1-heat-tip[hidden] { display:none; }
.m1-heat-tip::before { content:""; position:absolute; top:-7px; right:16px; width:12px; height:12px; border-top:1px solid #c9c9c9; border-left:1px solid #c9c9c9; background:#fff; transform:rotate(45deg); }
.m1-heat-tip > strong { font-size:14px; }
.m1-heat-tip .m1-heat-note { color:#222; font-size:13px; }
.m1-color-item .m1-heat { display:block; }
.m1-color-heat:empty { display:none; }
.m1-heat-meter { flex:none; display:flex; align-items:flex-end; gap:2px; height:16px; }
.m1-heat-meter i { display:block; width:4px; border-radius:1px; background:#d6d6d6; }
.m1-heat-meter i:nth-child(1) { height:6px; } .m1-heat-meter i:nth-child(2) { height:8.5px; } .m1-heat-meter i:nth-child(3) { height:11px; } .m1-heat-meter i:nth-child(4) { height:13.5px; } .m1-heat-meter i:nth-child(5) { height:16px; }
.m1-heat-meter i.is-on { background:#222; }
.m1-heat-text { display:grid; gap:2px; min-width:0; line-height:1.35; }
.m1-heat-badge { justify-self:start; padding:1px 8px; border:1px solid #bdbdbd; border-radius:999px; background:#f1f1f1; color:#222; font-size:12px; font-weight:700; white-space:nowrap; }
.m1-heat[data-level="3"] .m1-heat-badge { border-color:#222; background:#fff; }
.m1-heat[data-level="4"] .m1-heat-badge, .m1-heat[data-level="5"] .m1-heat-badge { border-color:#222; background:#222; color:#fff; }
.m1-heat[data-level="5"] .m1-heat-badge { box-shadow:0 0 0 2px #fff, 0 0 0 3px #222; }
.m1-heat[data-level="6"] .m1-heat-badge { border-style:dashed; border-color:#888; background:#fff; color:#555; }
.m1-heat-note { font-size:12px; font-weight:400; color:var(--m1-muted); }
/* Demand colours. Green, yellow and red come from the app's CoreColor tokens; orange is a proposed new token. */
.m1-heat[data-level="1"] .m1-heat-badge { border-color:#6AD09D; background:#DCFCE7; color:#18613C; box-shadow:none; }
.m1-heat[data-level="2"] .m1-heat-badge { border-color:#FEBA2B; background:#FFF3D0; color:#85570E; box-shadow:none; }
.m1-heat[data-level="3"] .m1-heat-badge { border-color:#F0A04B; background:#FFE6C7; color:#8F4400; box-shadow:none; }
.m1-heat[data-level="4"] .m1-heat-badge { border-color:#F76868; background:#FFD6D6; color:#9B1515; box-shadow:none; }
.m1-heat[data-level="5"] .m1-heat-badge { border-color:#DE1D1D; background:#DE1D1D; color:#fff; box-shadow:none; }
.m1-heat[data-level="6"] .m1-heat-badge { border-style:dashed; border-color:#A0A2B7; background:#EFEFF4; color:#595C79; box-shadow:none; }
.m1-heat-legend { margin-top:20px; padding-top:16px; border-top:1px solid var(--m1-line); }
.m1-heat-legend h5 { margin:0 0 4px; font-size:14px; }
.m1-heat-legend > p { margin:0 0 12px; color:var(--m1-muted); font-size:13px; }
.m1-notes .m1-heat-legend ul { list-style:none; padding:0; display:grid; gap:12px; }
.m1-notes .m1-heat-legend li + li { margin-top:0; }
.m1-heat-rule { display:block; margin:2px 0 0; font-size:12px; color:#444; }
.m1-model-option[hidden] { display:none; }
.m1-model-option[aria-pressed="true"] { color:#2c65c2; font-weight:700; }
.m1-model-options { padding:0 24px 12px; overflow:auto; }
.m1-model-options h5 { margin:8px 0 4px; color:#595c79; font-size:14px; }
.m1-model-sheet { background:#fafafa; border-radius:24px 24px 0 0; }
.m1-model-sheet .m2-extra-form { grid-template-rows:auto minmax(0,1fr); }
.m1-model-sheet .m2-extra-header { padding-inline:24px; border-bottom:0; }
.m1-model-sheet .m2-extra-header h4 { margin:0; color:#12284e; font-size:20px; }
.m2-accessory-form { grid-template-rows:auto minmax(0,1fr) auto auto; }
.m2-extra-header { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--m1-line); }
.m2-extra-header button { min-height:44px; padding:0 12px; border:0; background:transparent; color:#222; font:inherit; cursor:pointer; }
.m2-extra-header label,.m2-extra-header input { grid-column:1/-1; }
.m2-extra-header input { width:100%; min-width:0; min-height:44px; padding:8px 12px; border:1px solid #aaa; border-radius:8px; font:inherit; }
.m2-extra-results { overflow:auto; padding:0 16px; }
.m2-extra-results [hidden] { display:none; }
.m2-extra-results p { padding:16px 0; }
.m2-extra-footer { padding:12px 16px max(12px,env(safe-area-inset-bottom)); border-top:1px solid var(--m1-line); }
.m2-extra-footer button { width:100%; cursor:pointer; }
.m2-extra-footer button:disabled { opacity:.5; cursor:default; }
</style>
</head>

</article></section><aside class="m1-notes" aria-label="คำอธิบาย M1"><h4>สิ่งที่ปรับใน M1</h4><ul><li>ย้าย <strong>MU-X 4x2</strong> ไว้ใต้รูปรถโดยตรง</li><li>แสดง <strong>ชื่อสี</strong> ใต้ชื่อรุ่นรถ</li><li>เลือกรุ่นย่อยผ่าน Bottom Sheet ภายในเฟรม</li><li>ตัดตารางคิวออก <strong>สถานะคิว 6 ระดับ</strong> ย้ายไปอยู่ในรายการสีด้านซ้ายของรูปรถ (กว้าง 30%) แต่ละแถวมีชื่อสี สถานะคิว และราคาเพิ่มของสี จึงไม่มีชื่อสีใต้รูปรถ แตะแถวเพื่อเลือกสี ไม่บอกจำนวนสต็อกหรือยอดจอง ตำแหน่งอื่นอีก 3 แบบยังลองสลับได้จากปุ่มเหนือจอ</li><li>ไอคอน <strong>i</strong> ขวาสุดของแถบ "สร้างใบจอง" เปิดกล่องคำอธิบายใต้ไอคอน ไม่บังทั้งจอ บอกความหมายของป้ายทั้ง 6 แบบ เป็นภาษาที่ลูกค้าอ่านได้ ไม่มีตัวเลข %</li><li>ป้าย <strong>Limited</strong> มีเวลานับถอยหลัง 10 นาทีอยู่ในป้าย เห็นได้ทุกสีที่เป็น Limited โดยไม่ต้องเลือก กดรีเฟรชหรือสลับสีแล้วเวลาเดินต่อ ไม่เริ่มใหม่ จะล้างเมื่อจองสำเร็จเท่านั้น ต้องตกลงกับลูกค้าว่าเวลานี้อ้างอิงอะไรในระบบจริง</li><li>แถบล่างแสดง <strong>ราคารวมทั้งหมด</strong> แตะ "ดูรายละเอียด" เพื่อดูรุ่นย่อย สี ราคาต่อคัน และจำนวน</li><li><strong>พ.ร.บ. และประกันภัย</strong> ย้ายไปขั้นที่ 4 ชำระเงินและประกันภัย ใต้ประเภทการขาย</li><li>เลื่อนเฉพาะเนื้อหาได้ โดยรูปรถ ชื่อรุ่น ตัวเลือกสี และยอดรวมยังอยู่บนหน้าจอ</li></ul><div class="m1-heat-legend"><h5>สถานะคิว 6 ระดับ</h5><p>เทียบยอดจองที่ยังไม่ได้รถ กับรถพร้อมส่งของรุ่นย่อยและสีนั้น</p><ul data-m1-heat-legend></ul></div><div class="m1-heat-legend"><h5>ตำแหน่งสถานะคิว เทียบตามหลัก UX/UI</h5><p>หลักที่ใช้: สถานะต้องเห็นได้ทันที อยู่ใกล้สิ่งที่มันอธิบาย จุดแตะไม่เล็กกว่า 44 px และไม่บอกความหมายด้วยสีอย่างเดียว</p><ul>
<li><strong>ก. รายการสีซ้ายรูปรถ (เลือกแล้ว)</strong><span class="m1-heat-rule">กว้าง 30% เทียบทุกสีได้โดยไม่ต้องแตะ มีชื่อสีกำกับ จุดแตะเป็นแถวสูงเกิน 44 px รายการนี้ใช้เลือกสีแทนแถววงสี แต่รุ่นที่มีหลายสีรายการจะสูงกว่ารูป</span></li>
<li><strong>ข. ป้ายมุมรูปรถ</strong><span class="m1-heat-rule">คุ้นตาเหมือนป้ายสินค้า ไม่กินพื้นที่ แต่ไม่มีคำอธิบาย และอยู่ไกลจากวงสี จึงเชื่อมโยงกับสีที่เลือกได้ยากกว่า</span></li>
<li><strong>ค. ใต้ทุกวงสี</strong><span class="m1-heat-rule">อยู่ติดกับวงสีที่มันอธิบาย เทียบทุกสีได้ทันที แต่ป้ายเล็ก (ตัวอักษร 10 px) และไม่มีคำอธิบาย</span></li>
<li><strong>ง. ต่อท้ายชื่อสี</strong><span class="m1-heat-rule">อ่านต่อเนื่องเป็นประโยคเดียวกับชื่อสี ใช้ที่น้อยที่สุด แต่เห็นทีละสีและไม่เด่น</span></li>
</ul></div><p class="m1-notes-data">เกณฑ์ % เป็นร่าง ต้องยืนยันกับลูกค้าก่อนใช้งานจริง และต้องตกลงว่ารุ่นที่ยังไม่มีรถพร้อมส่งแต่มีคนจองเยอะ ควรเป็น Pre-order หรือ High Demand</p><p class="m1-notes-data">ข้อมูลรุ่น สี รหัส และราคาอ้างอิง <a href="https://booking-dev.fourwd.me/master-data/vehicle-brand/01/vehicle-model/08/vehicle-sub-model">Booking Dev</a> · สีวงกลมใช้เพื่อแสดงตัวอย่าง</p></aside></div></div></div><dialog id="m1-dialog" aria-label="M1 เลือกรุ่นย่อย ขนาดเต็ม"><div class="m1-dialog-toolbar"><span>M1 เลือกรุ่นย่อย</span><button class="m1-close" type="button" id="m1-close" autofocus>ปิด</button></div><div id="m1-dialog-content"></div></dialog></figure><figure class="card" id="m-acc">

      <p>ชื่อไฟแนนซ์ ราคารถ อัตรามัดจำเริ่มต้น 50% เงินจอง 1,000 บาท และรายการรับเงินสดที่มีมาให้ เป็นข้อมูลตัวอย่าง ยังต้องยืนยันว่าเงินสดไม่ต้องแนบหลักฐาน และรับชำระไม่ครบแล้วบันทึกใบจองได้ไหม ยังไม่มีการคิดเบี้ยประกันในยอดที่ต้องรับ ยังไม่ได้ตกลงว่ามัดจำมีขั้นต่ำไหม ตอนนี้กรอก 0 ได้</p>
    </aside>
  </div>
  </figure></section></main>
</div>
<script>
  const gallerySections = [...document.querySelectorAll('.wrap > main > section, main > section')];
  const galleryLinks = [...document.querySelectorAll('nav a[href^="#"]')];
  let activeGallerySection;
  let galleryScrollFrame;

  function setGalleryLocation(locationId) {
    galleryLinks.forEach(link => {
      link.classList.toggle('is-current', link.hash === '#' + activeGallerySection.id);
      if (link.hash === '#' + locationId) link.setAttribute('aria-current', 'location');
      else link.removeAttribute('aria-current');
    });
  }

  function showGallerySection() {
    const locationId = ['#pay', '#m-pay'].includes(location.hash) ? 'pay-deposit' : location.hash.slice(1);
    const target = document.getElementById(locationId);
    activeGallerySection = gallerySections.find(section => section.contains(target)) ?? gallerySections[0];
    gallerySections.forEach(section => { section.hidden = section !== activeGallerySection; });
    const visibleTarget = target && activeGallerySection.contains(target) ? target : activeGallerySection;
    setGalleryLocation(visibleTarget.id);
    if (target) visibleTarget.scrollIntoView({block:'start'});
  }

  window.addEventListener('hashchange', showGallerySection);
  window.addEventListener('scroll', () => {
    if (galleryScrollFrame) return;
    galleryScrollFrame = requestAnimationFrame(() => {
      galleryScrollFrame = 0;
      let locationId = activeGallerySection.id;
      const readingLine = Math.min(160, innerHeight * .25);
      for (const card of activeGallerySection.querySelectorAll(':scope > .card[id]')) {
        if (card.getBoundingClientRect().top <= readingLine) locationId = card.id;
      }
      setGalleryLocation(locationId);
    });
  }, {passive:true});
  showGallerySection();

  function createFrameSheets(frame) {
    const scrim = document.createElement('div');
    scrim.className = 'booking-frame-scrim';
    scrim.hidden = true;
    frame.append(scrim);
    const stack = [];

    function updateFrame() {
      const active = stack.at(-1);
      scrim.hidden = !active;
      for (const element of frame.children) {
        if (element === scrim) continue;
        element.inert = Boolean(active && element !== active);
        if (element.matches('.m2-extra-dialog')) {
          element.toggleAttribute('data-frame-covered', element.open && element !== active);
          element.style.zIndex = element === active ? 5 : 3;
        }
      }
      scrim.style.zIndex = stack.length > 1 ? 4 : 2;
    }

    scrim.addEventListener('click', () => stack.at(-1)?.close());

    return dialog => {
      frame.append(dialog);
      dialog.addEventListener('beforetoggle', event => {
        if (event.newState !== 'closed') return;
        const index = stack.indexOf(dialog);
        if (index !== -1) stack.splice(index, 1);
        updateFrame();
      });
      dialog.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          dialog.close();
        }
        if (event.key !== 'Tab') return;
        const controls = Array.from(dialog.querySelectorAll('button,input,textarea')).filter(control =>
          !control.disabled && !control.closest('[inert]') && control.tabIndex >= 0 && control.getClientRects().length
        );
        const first = controls[0];
        const last = controls.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last?.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first?.focus();
        }
      });
      return {
        open(focusTarget) {
          stack.push(dialog);
          dialog.inert = false;
          dialog.show();
          updateFrame();
          dialog.scrollIntoView({block:'nearest', inline:'nearest'});
          focusTarget.focus({preventScroll:true});
        }
      };
    };
  }

  // Snapshot of Booking Dev master data. Swatches are illustrative.
  const m1Paints = {
    BOS: ['เงินโบฮีเมียน เมทัลลิก', 'Metallic', '#c5cbd2'],
    DWP: ['ขาวมุกโดโลไมท์', 'Pearl', '#faf9f4'],
    BAB: ['ดำบาวาเรียน ไมก้า', 'Metallic', '#24282f'],
    HVG: ['เทา ฮาวาสุ', 'Metallic', '#898a83'],
    HGB: ['เทา ฮาวาสุ หลังคาดำ', 'Two-tone Met./Met.', 'linear-gradient(135deg,#24282f 50%,#898a83 50%)'],
    DPB: ['ขาวมุก หลังคาดำ', 'Two-tone Pearl/Met.', 'linear-gradient(135deg,#24282f 50%,#faf9f4 50%)'],
    EGG: ['เทาไอเกอร์ โอเพค', 'Metallic', '#7b8089'],
    EGB: ['เทาไอเกอร์ โอเพค', 'Two-tone Met./Met.', 'linear-gradient(135deg,#24282f 50%,#7b8089 50%)'],
    DWB: ['ขาวมุกโดโลไมท์', 'Two-tone Pearl/Met.', 'linear-gradient(135deg,#24282f 50%,#faf9f4 50%)'],
    ETR: ['แดงเอทนา ไมก้า', 'Metallic', '#963d45'],
    IVM: ['เงินไอซ์เบิร์ก ไมก้า', 'Metallic', '#b8b9be'],
    NGB: ['น้ำเงินกลาเซียร์ ไมก้า', 'Metallic', '#35536b'],
  };
  // Queue status levels: [badge, line under the badge, draft rule]. Ratio = bookings still waiting / vehicles ready to deliver.
  const m1DemandLevels = {
    1: ['In Stock', 'พร้อมส่ง รับรถทันที', 'จองน้อยกว่า 50% ของรถพร้อมส่ง'],
    2: ['Limited', 'รับรถทันที รถเหลือไม่มาก', 'จอง 50-99%'],
    3: ['Popular', 'ยอดจองพอ ๆ กับรถที่มี', 'จอง 100-120% ปริ่มกับรถที่มี'],
    4: ['Trending', 'จองเกินรถที่มี รอรถล็อตถัดไป', 'จอง 121-200%'],
    5: ['High Demand', 'คนจองเยอะมาก คิวยาว', 'จองเกิน 2 เท่าของรถพร้อมส่ง'],
    6: ['Pre-order', 'รอรถเข้า ยังไม่มีกำหนดส่ง', 'ยังไม่มีรถพร้อมส่ง เช่น รุ่นใหม่ที่รถยังไม่เข้า'],
  };
  // Sample level per paint code for the prototype; the app would get this from the API, never the raw counts.
  const m1SampleDemand = { BOS:2, DWP:5, BAB:1, HVG:2, HGB:6, DPB:4, EGG:2, EGB:3, DWB:4, ETR:4, IVM:1, NGB:1 };
  // Hold countdown for a Limited colour. The deadline is kept per sub-model and colour, so
  // refreshing or switching colours never restarts it; only a completed booking would clear it.
  // For the number to be true, the server has to hold the vehicle for the same 10 minutes.
  const m1Holds = {};
  const m1HoldMs = 10 * 60 * 1000;
  function m1HoldText(deadline) {
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    return String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
  }
  function m1HoldSpan(code) {
    const key = m1State.model + ':' + code;
    m1Holds[key] ??= Date.now() + m1HoldMs;
    const span = document.createElement('span');
    span.className = 'm1-hold';
    span.dataset.m1Hold = key;
    span.setAttribute('role', 'timer');
    span.textContent = m1HoldText(m1Holds[key]);
    return span;
  }
  setInterval(() => {
    m1Root.querySelectorAll('[data-m1-hold]').forEach(node => { node.textContent = m1HoldText(m1Holds[node.dataset.m1Hold]); });
  }, 1000);
  function m1HeatBadge(level, code) {
    const [badge, note] = m1DemandLevels[level];
    const wrap = document.createElement('div');
    wrap.className = 'm1-heat';
    wrap.dataset.level = String(level);
    const text = document.createElement('span');
    text.className = 'm1-heat-text';
    const name = document.createElement('span');
    name.className = 'm1-heat-badge';
    name.lang = 'en';
    name.textContent = badge;
    if (level === 2 && code) name.append(' ', m1HoldSpan(code));
    const line = document.createElement('span');
    line.className = 'm1-heat-note';
    line.textContent = note;
    text.append(name, line);
    wrap.append(text);
    return wrap;
  }
  // Each paint entry contains its paint code, full model code and surcharge.
  const m1Models = [
    ['2.2 Active', 2027, 1197000, [['BOS','VUA20',0],['DWP','VUA30',12000]]],
    ['2.2 Elegant', 2027, 1432000, [['BAB','VUB20',0],['HVG','VUB20',0],['DWP','VUB30',12000]]],
    ['2.2 Ultimate', 2027, 1557000, [['BAB','VUC20',0],['HVG','VUC20',0],['DWP','VUC30',12000]]],
    ['2.2 RS', 2027, 1627000, [['BAB','VUD20',0],['HGB','VUD50',0],['DPB','VUD60',12000]]],
    ['2.2 Biturbo Elegant', 2027, 1474000, [['BAB','VUF20',0],['HVG','VUF20',0],['DWP','VUF30',12000]]],
    ['2.2 Biturbo RS', 2027, 1674000, [['BAB','VUG20',0],['HGB','VUG50',0],['DPB','VUG60',12000]]],
    ['2.2 Active', 2026, 1194000, [['BOS','UUA20',0],['DWP','UUA30',12000]]],
    ['2.2 Elegant', 2026, 1429000, [['BOS','UUB20',0],['BAB','UUB20',0],['EGG','UUB20',0],['DWP','UUB30',12000]]],
    ['2.2 Ultimate', 2026, 1554000, [['BAB','UUC20',0],['EGG','UUC20',0],['DWP','UUC30',12000]]],
    ['2.2 RS', 2026, 1624000, [['BAB','UUD20',0],['EGB','UUD50',0],['DWB','UUD60',12000]]],
    ['3.0 RS', 2026, 1659000, [['BAB','UUG20',0],['EGB','UUG50',0],['DWB','UUG60',12000]]],
    ['3.0 Ultimate', 2025, 1589000, [['BOS','TUF20',0],['BAB','TUF20',0],['EGG','TUF20',0],['ETR','TUF20',0],['IVM','TUF20',0],['DWP','TUF30',12000]]],
    ['1.9 Ultimate', 2023, 1514000, [['BOS','RUD20',9000],['BAB','RUD20',0],['ETR','RUD20',0],['IVM','RUD20',9000],['NGB','RUD20',9000],['DWP','RUD30',21000]]],
  ].map(([name, year, price, paints]) => ({name, year, price, paints, code: paints[0][1].slice(0, 3)}));
  const m1State = {model:6,color:'BOS',hasInsurance:false,hasCompulsoryInsurance:false,insuranceClass:'',quantity:2,priceMode:'e',priceDetails:false,heatMode:'list'};
  const m1Root = document.getElementById('m1-composite');
  const m1Currency = value => '฿' + new Intl.NumberFormat('th-TH').format(value);
  m1Root.querySelectorAll('[data-m1-model-trigger]').forEach(trigger => {
    const frame = trigger.closest('.m1-live-screen');
    const dialog = document.createElement('dialog');
    const titleId = trigger.id + '-sheet-title';
    dialog.className = 'm2-extra-dialog m1-model-sheet';
    dialog.setAttribute('aria-labelledby', titleId);
    dialog.innerHTML = `
      <div class="m2-extra-form">
        <header class="m2-extra-header">
          <h4 id="${titleId}">รุ่นย่อย</h4>
          <button type="button" data-model-cancel aria-label="ปิด">×</button>
          <input type="search" aria-label="ค้นหารุ่นย่อย" placeholder="ค้นหา">
        </header>
        <div class="m1-model-options"><p data-model-empty hidden>ไม่พบรุ่นย่อยที่ตรงกับคำค้นหา</p></div>
      </div>`;
    const list = dialog.querySelector('.m1-model-options');
    const search = dialog.querySelector('input[type="search"]');
    const options = m1Models.map(({name, code}, index) => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'm1-model-option';
      const badge = document.createElement('span');
      badge.className = 'm1-code';
      badge.textContent = code;
      const label = document.createElement('span');
      label.lang = 'en';
      label.textContent = name;
      option.append(badge, label);
      option.addEventListener('click', () => {
        m1State.model = index;
        const {paints} = m1Models[index];
        if (!paints.some(([code]) => code === m1State.color)) m1State.color = paints[0][0];
        m1RenderVehicle();
        m1Render();
        dialog.close();
      });
      return option;
    });
    const years = [...new Set(m1Models.map(model => model.year))].sort();
    const groups = years.map(year => {
      const group = document.createElement('section');
      const heading = document.createElement('h5');
      heading.textContent = 'ปี ' + year;
      group.append(heading);
      m1Models.forEach((model, index) => {
        if (model.year === year) group.append(options[index]);
      });
      list.append(group);
      return group;
    });
    function filterModels() {
      const query = search.value.trim().toLowerCase();
      m1Models.forEach(({name, code, year}, index) => {
        options[index].hidden = ![name, code, String(year)].some(value => value.toLowerCase().includes(query));
      });
      groups.forEach(group => { group.hidden = !group.querySelector('button:not([hidden])'); });
      list.querySelector('[data-model-empty]').hidden = groups.some(group => !group.hidden);
    }
    search.addEventListener('input', filterModels);
    const sheet = createFrameSheets(frame)(dialog);
    trigger.addEventListener('click', () => {
      search.value = '';
      filterModels();
      options.forEach((option, index) => option.setAttribute('aria-pressed', String(index === m1State.model)));
      trigger.setAttribute('aria-expanded', 'true');
      const selected = options[m1State.model];
      sheet.open(selected);
      selected.scrollIntoView({block:'nearest'});
    });
    dialog.querySelector('[data-model-cancel]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      trigger.setAttribute('aria-expanded', 'false');
      trigger.focus({preventScroll:true});
    });
  });
  function m1RenderVehicle() {
    const model = m1Models[m1State.model];
    const [paintCode, , surcharge] = model.paints.find(([code]) => code === m1State.color);
    const [paintName] = m1Paints[paintCode];
    for (const trigger of m1Root.querySelectorAll('[data-m1-model-trigger]')) {
      trigger.querySelector('.m1-code').textContent = model.code;
      trigger.querySelector('.m1-option-name').textContent = model.name + ' ' + model.year;
      trigger.querySelector('.m1-submodel-price').textContent = m1Currency(model.price);
      trigger.setAttribute('aria-label', 'รุ่นย่อย ' + model.code + ' ' + model.name + ' ' + model.year);
    }
    for (const picker of m1Root.querySelectorAll('.m1-color-picker')) {
      const activeSwatch = picker.contains(document.activeElement);
      picker.replaceChildren(...model.paints.map(([code]) => {
        const [name, type, swatch] = m1Paints[code];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'm1-color-button';
        const level = m1SampleDemand[code];
        button.setAttribute('aria-label', name + ' (' + code + ') · ' + type + ' · ' + m1DemandLevels[level][0]);
        button.setAttribute('aria-pressed', String(code === paintCode));
        button.style.setProperty('--swatch', swatch);
        const dot = document.createElement('span');
        dot.className = 'm1-color-dot';
        dot.setAttribute('aria-hidden', 'true');
        button.append(dot);
        button.addEventListener('click', () => {
          m1State.color = code;
          m1RenderVehicle();
          m1Render();
        });
        const item = document.createElement('div');
        item.className = 'm1-color-item';
        item.append(button);
        // Demand badge under every swatch, so colours can be compared without tapping each one.
        if (m1State.heatMode === 'each') {
          const tag = document.createElement('span');
          tag.className = 'm1-heat';
          tag.dataset.level = String(level);
          const label = document.createElement('span');
          label.className = 'm1-heat-badge';
          label.lang = 'en';
          label.textContent = m1DemandLevels[level][0];
          if (level === 2) label.append(' ', m1HoldSpan(code));
          tag.append(label);
          item.append(tag);
        }
        return item;
      }));
      if (activeSwatch) picker.querySelector('[aria-pressed="true"]').focus({preventScroll:true});
    }
    // Full badge with its note for the selected colour, under the swatches.
    const heatMode = m1State.heatMode;
    // Badge only, without the note line.
    const heatTag = code => {
      const tag = m1HeatBadge(m1SampleDemand[code], code);
      tag.querySelector('.m1-heat-note').remove();
      return tag;
    };
    m1Root.querySelectorAll('.m1-hero').forEach(hero => { hero.dataset.heatMode = heatMode; });
    m1Root.querySelectorAll('.m1-color-picker').forEach(picker => { picker.hidden = heatMode === 'list'; });
    m1Root.querySelectorAll('[data-m1-heat-hero]').forEach(node => {
      node.replaceChildren(...(heatMode === 'top' ? [m1HeatBadge(m1SampleDemand[paintCode], paintCode)] : heatMode === 'corner' ? [heatTag(paintCode)] : []));
    });
    m1Root.querySelectorAll('[data-m1-heat-list]').forEach(list => {
      const hadFocus = list.contains(document.activeElement);
      list.hidden = heatMode !== 'list';
      list.replaceChildren(...(heatMode !== 'list' ? [] : model.paints.map(([code, , extra]) => {
        const [name, , swatch] = m1Paints[code];
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'm1-heat-row';
        row.setAttribute('aria-pressed', String(code === paintCode));
        const dot = document.createElement('span');
        dot.className = 'm1-color-dot';
        dot.style.setProperty('--swatch', swatch);
        dot.setAttribute('aria-hidden', 'true');
        const label = document.createElement('span');
        label.textContent = name;

  const m2List = m2Equipment.querySelector('.m2-accessory-list');
  const m2AddAccessory = m2Equipment.querySelector('[data-m2-add-accessory]');
  const m2Editor = document.getElementById('m2-accessory-editor');
  const m2Form = document.getElementById('m2-accessory-form');
  const m2SelectItem = m2Editor.querySelector('.m2-catalog-trigger');
  const m2Price = m2Form.elements.price;
  const m2Trade = m2Form.elements.trade;
  const m2Quantity = m2Form.elements.quantity;
  const m2Notes = m2Form.elements.notes;
  const m2Confirm = m2Form.querySelector('[type="submit"]');
  const m2EditorSheet = attachM2Sheet(m2Editor);
  const m2CatalogSearch = document.getElementById('m2-catalog-search');
  const m2CatalogView = m2Editor.querySelector('[data-m2-catalog-view]');
  const m2CatalogResults = m2Editor.querySelector('[data-m2-catalog-results]');
  const m2Selection = m2Editor.querySelector('[data-m2-accessory-selection]');
  const m2Details = m2Editor.querySelector('[data-m2-accessory-details]');
  let m2Editing = null;
  let m2Draft = null;

  function renderM2Accessories() {
    m2List.replaceChildren();
    const rowsByCategory = m2Categories.map(() => []);
    let totalCents = 0;
    m2Accessories.forEach((item, id) => {
      const product = m2Catalog[id];
      const netCents = m2NetCents(item);
      totalCents += netCents;
      const row = document.createElement('li');
      row.className = 'm2-accessory-row';
      const description = document.createElement('div');
      row.append(description);
      const title = document.createElement('div');
      title.className = 'm2-accessory-name';
      const name = document.createElement('h5');
      name.textContent = product.name;
      title.append(name);
      description.append(title);
      if (product.tradeIn) {
        const badge = document.createElement('span');
        badge.className = 'm2-trade-badge';
        badge.textContent = 'หักเทิร์นได้';
        title.append(badge);
      }
      const breakdown = document.createElement('div');
      breakdown.className = 'm2-accessory-breakdown';
      const unit = document.createElement('div');
      unit.className = 'm2-accessory-unit';
      const unitPrice = document.createElement('span');
      unitPrice.textContent = m2Money(item.price);
      const quantity = document.createElement('span');
      quantity.textContent = '× ' + item.quantity + ' ชิ้น';
      unit.append(unitPrice, quantity);
      breakdown.append(unit);
      if (item.trade > 0) {
        const deduction = document.createElement('span');
        deduction.className = 'm2-accessory-deduction';
        deduction.textContent = '−' + m2Money(item.trade);
        deduction.setAttribute('aria-label', 'หักเทิร์น ' + m2Money(item.trade));
        breakdown.append(deduction);
      }
      row.append(breakdown);
      if (item.notes) {
        const notes = document.createElement('p');
        notes.textContent = item.notes;
        description.append(notes);
      }
      const amount = document.createElement('strong');
      amount.className = 'm2-accessory-price';
      amount.textContent = m2Money(netCents / 100);
      amount.setAttribute('aria-label', 'ราคาสุทธิ ' + amount.textContent);
      const actions = document.createElement('div');
      actions.className = 'm2-accessory-actions';
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.dataset.m2Edit = id;
      edit.textContent = 'แก้ไข';
      edit.setAttribute('aria-label', 'แก้ไข ' + product.name);
      edit.addEventListener('click', () => openM2AccessoryEditor(id));
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = 'ลบ';
      remove.setAttribute('aria-label', 'ลบ ' + product.name);
      remove.addEventListener('click', () => {
        m2Accessories.delete(id);
        renderM2Accessories();
        m2AddAccessory.focus();
      });
      actions.append(edit, remove);
      description.append(actions);
      row.append(amount);
      rowsByCategory[product.category].push(row);
    });
    rowsByCategory.forEach((rows, category) => {
      if (!rows.length) return;
      const heading = document.createElement('li');
      heading.className = 'm2-accessory-heading';
      heading.textContent = m2Categories[category];
      m2List.append(heading, ...rows);
    });
    const count = m2Accessories.size;
    const total = m2Money(totalCents / 100);
    m2Equipment.querySelector('[data-m2-accessory-empty]').hidden = count > 0;
    m2Equipment.querySelector('[data-m2-accessory-count]').textContent = count + ' รายการ';
    m2Equipment.querySelector('[data-m2-accessory-total-count]').textContent = count;
    m2Equipment.querySelector('[data-m2-accessory-total]').textContent = total;
    m2Equipment.querySelector('[data-m2-footer-accessories]').textContent = total;
    // Step 4 (M3) derives the accessory deposit from this list.
    m2Equipment.dispatchEvent(new CustomEvent('m2-accessories-change'));
  }

  function updateM2AccessoryPrice() {
    if (m2Draft === null) return;
    const { tradeIn } = m2Catalog[m2Draft];
    const item = {
      price: m2Price.valueAsNumber,
      trade: tradeIn ? Number(m2Trade.value) : 0,
      quantity: m2Quantity.valueAsNumber,
      notes: m2Notes.value.trim(),
    };
    const gross = Math.round(item.price * 100) * item.quantity / 100;
    m2Trade.max = Number.isFinite(gross) ? String(gross) : '';
    m2Trade.setCustomValidity(item.trade > gross ? 'ราคาหักเทิร์นต้องไม่เกินราคารวมก่อนหักเทิร์น' : '');
    const valid = m2Price.validity.valid && m2Trade.validity.valid && m2Quantity.validity.valid;
    m2Editor.querySelector('[data-m2-gross-label]').textContent = Number.isFinite(gross)
      ? 'ราคา ' + m2Money(item.price) + ' × ' + item.quantity
      : 'ราคา × จำนวน';
    m2Editor.querySelector('[data-m2-gross]').textContent = Number.isFinite(gross) ? m2Money(gross) : '—';
    m2Editor.querySelector('[data-m2-trade-summary-value]').textContent = '−' + m2Money(item.trade);
    const net = valid ? m2Money(m2NetCents(item) / 100) : '';
    m2Editor.querySelector('[data-m2-net]').textContent = net || '—';
    const action = m2Editing === null ? 'เพิ่มรายการ' : 'บันทึก';
    m2Confirm.textContent = net ? action + ' ' + net : action;
    return valid ? item : null;
  }

  function setM2AccessoryDraft(id, item) {
    m2Draft = id;
    const product = m2Catalog[id];
    const tradeIn = Boolean(product?.tradeIn);
    m2Editor.querySelector('#m2-accessory-item').textContent = product?.name ?? 'เลือกอุปกรณ์';
    m2Editor.querySelector('.m2-accessory-numbers').hidden = !product;
    m2Selection.hidden = !product;
    m2Details.hidden = !product;
    m2Editor.querySelector('.m2-price-review').hidden = !product;
    m2Editor.querySelector('[data-m2-trade-field]').hidden = !tradeIn;
    m2Editor.querySelector('[data-m2-trade-summary]').hidden = !tradeIn;
    m2Editor.querySelector('[data-m2-net-label]').textContent = tradeIn ? 'ราคาหลังหักเทิร์น' : 'รวม';
    m2Price.value = item?.price ?? product?.price ?? '';
    m2Price.readOnly = !tradeIn;
    m2Price.disabled = !product;
    m2Trade.value = item?.trade ?? 0;
    m2Trade.disabled = !tradeIn;
    m2Trade.setCustomValidity('');
    m2Quantity.value = item?.quantity ?? 1;
    m2Quantity.disabled = !product;
    m2Notes.value = item?.notes ?? '';
    m2Confirm.disabled = !product;
    m2Confirm.textContent = m2Editing === null ? 'เพิ่มรายการ' : 'บันทึก';
    updateM2AccessoryPrice();
  }

  function openM2AccessoryEditor(id) {
    m2Editing = id;
    m2Editor.querySelector('h4').textContent = id === null ? 'เพิ่มของแต่ง' : 'แก้ไขของแต่ง';
    setM2AccessoryDraft(id, m2Accessories.get(id));
    setM2CatalogVisible(id === null);
    m2EditorSheet.open(id === null ? m2CatalogSearch : m2SelectItem);
  }

  function setM2CatalogVisible(visible) {
    m2CatalogView.hidden = !visible;
    m2SelectItem.setAttribute('aria-expanded', String(visible));
    if (visible) {
      m2CatalogSearch.value = '';
      renderM2Catalog();
    }
  }

  function renderM2Catalog() {
    const query = m2CatalogSearch.value.trim().toLocaleLowerCase('th');
    const fragment = document.createDocumentFragment();
    m2Catalog.forEach((product, id) => {
      if ((m2Accessories.has(id) && id !== m2Editing) || !product.name.toLocaleLowerCase('th').includes(query)) return;
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'm2-catalog-option';
      const title = document.createElement('span');
      title.className = 'm2-accessory-name';
      title.append(product.name);
      if (product.tradeIn) {
        const badge = document.createElement('span');
        badge.className = 'm2-trade-badge';
        badge.textContent = 'หักเทิร์นได้';
        title.append(badge);
      }
      option.append(title);
      const price = document.createElement('strong');
      price.textContent = m2Money(product.price);
      option.append(price);
      option.addEventListener('click', () => {
        if (m2Draft !== id) setM2AccessoryDraft(id, {notes: m2Notes.value});
        setM2CatalogVisible(false);
        m2SelectItem.focus();
      });
      fragment.append(option);
    });
    if (!fragment.childElementCount) {
      const empty = document.createElement('p');
      empty.textContent = query ? 'ไม่พบของแต่งที่ตรงกับคำค้นหา' : 'เลือกของแต่งตัวอย่างครบแล้ว';
      fragment.append(empty);
    }
    m2CatalogResults.replaceChildren(fragment);
  }

  // Adding accessories uses a full page like the gift picker: search plus the catalog under
  // its category headings. Tapping a row opens the fill-in sheet on top of the page, so price,
  // trade-in, notes and quantity are entered before the item is added.
  const m2Picker = document.getElementById('m2-accessory-picker');
  const m2PickerSheet = attachM2Sheet(m2Picker);
  const m2PickerForm = m2Picker.querySelector('form');
  const m2PickerSearch = document.getElementById('m2-accessory-pick-search');
  const m2PickerResults = m2Picker.querySelector('[data-m2-accessory-pick-results]');
  const m2PickerEmpty = m2Picker.querySelector('[data-m2-accessory-pick-empty]');
  const m2PickSections = m2Categories.map(name => {
    const section = document.createElement('section');
    const heading = document.createElement('h5');
    const count = document.createElement('span');
    heading.append(name + ' ', count);
    const list = document.createElement('div');
    section.append(heading, list);
    m2PickerResults.insertBefore(section, m2PickerEmpty);
    return {section, count, list};
  });
  const m2PickOptions = m2Catalog.map((product, id) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'm2-gift';
    const title = document.createElement('span');
    title.className = 'm2-accessory-name';
    title.append(product.name);
    if (product.tradeIn) {
      const badge = document.createElement('span');
      badge.className = 'm2-trade-badge';
      badge.textContent = 'หักเทิร์นได้';
      title.append(badge);
    }
    const added = document.createElement('span');
    added.className = 'm2-added-badge';
    added.textContent = 'เพิ่มแล้ว';
    title.append(added);
    const price = document.createElement('strong');
    row.append(title, price);
    row.addEventListener('click', () => {
      if (m2Accessories.has(id)) openM2AccessoryEditor(id);
      else openM2AccessoryAdd(id);
    });
    m2PickSections[product.category].list.append(row);
    return {row, added, price};
  });

  function renderM2Picker() {
    const query = m2PickerSearch.value.trim().toLocaleLowerCase('th');
    const visible = m2Categories.map(() => 0);
    m2PickOptions.forEach(({row, added, price}, id) => {
      const product = m2Catalog[id];
      const item = m2Accessories.get(id);
      row.toggleAttribute('data-added', Boolean(item));
      added.hidden = !item;
      price.textContent = item ? m2Money(m2NetCents(item) / 100) : m2Money(product.price);
      row.hidden = !product.name.toLocaleLowerCase('th').includes(query);
      if (!row.hidden) visible[product.category]++;
    });
    m2PickSections.forEach(({section, count}, category) => {
      section.hidden = visible[category] === 0;
      count.textContent = '(' + visible[category] + ')';
    });
    m2PickerEmpty.hidden = visible.some(Boolean);
    m2PickerForm.querySelector('[type="submit"]').textContent = 'เสร็จสิ้น (' + m2Accessories.size + ')';
  }

  function openM2AccessoryAdd(id) {
    m2Editing = null;
    m2Editor.querySelector('h4').textContent = 'เพิ่มของแต่ง';
    setM2AccessoryDraft(id);
    setM2CatalogVisible(false);
    m2EditorSheet.open(m2SelectItem);
  }

  m2AddAccessory.addEventListener('click', () => {
    m2PickerSearch.value = '';
    renderM2Picker();
    m2PickerSheet.open(m2PickerSearch);
  });
  m2PickerSearch.addEventListener('input', renderM2Picker);
  m2Picker.querySelector('[data-m2-accessory-pick-close]').addEventListener('click', () => m2Picker.close());
  m2PickerForm.addEventListener('submit', event => {
    event.preventDefault();
    m2Picker.close();
  });
  m2Picker.addEventListener('close', () => m2AddAccessory.focus({preventScroll:true}));

  // Souvenirs are picked, not typed: the buttons list the names from master data. Typing is
  // only for a name the data does not have, and a typed name never becomes a button.
  // The names below are example data.
  const m2SouvenirNames = ['ร่ม', 'แก้วน้ำ', 'พวงกุญแจ', 'เสื้อยืด'];
  const m2Souvenirs = new Map();
  const m2SouvenirList = m2Equipment.querySelector('[data-m2-souvenir-list]');
  const m2SouvenirChips = m2Equipment.querySelector('[data-m2-souvenir-chips]');
  const m2SouvenirForm = m2Equipment.querySelector('[data-m2-souvenir-form]');
  const m2SouvenirInput = document.getElementById('m2-souvenir-input');

  function renderM2Souvenirs() {
    m2SouvenirList.replaceChildren();
    m2Souvenirs.forEach((quantity, name) => {
      const row = document.createElement('li');
      row.className = 'm2-souvenir-row';
      const label = document.createElement('span');
      label.textContent = name;
      const stepper = document.createElement('div');
      stepper.className = 'm2-accessory-quantity';
      const value = document.createElement('output');
      value.textContent = quantity;
      [-1, 1].forEach(step => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = step < 0 ? '−' : '+';
        button.setAttribute('aria-label', (step < 0 ? 'ลดจำนวน ' : 'เพิ่มจำนวน ') + name);
        button.addEventListener('click', () => {
          m2Souvenirs.set(name, Math.max(1, Math.min(99, m2Souvenirs.get(name) + step)));
          value.textContent = m2Souvenirs.get(name);
        });
        stepper.append(button);
      });
      stepper.insertBefore(value, stepper.lastChild);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = 'ลบ';
      remove.setAttribute('aria-label', 'ลบ ' + name);
      remove.addEventListener('click', () => {
        m2Souvenirs.delete(name);
        renderM2Souvenirs();
        m2SouvenirInput.focus({preventScroll:true});
      });
      row.append(label, stepper, remove);
      m2SouvenirList.append(row);
    });
    m2SouvenirChips.replaceChildren();
    m2SouvenirNames.filter(name => !m2Souvenirs.has(name)).forEach(name => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = '+ ' + name;
      chip.addEventListener('click', () => {
        m2Souvenirs.set(name, 1);
        renderM2Souvenirs();
        (m2SouvenirChips.querySelector('button') ?? m2SouvenirInput).focus({preventScroll:true});
      });
      m2SouvenirChips.append(chip);
    });
    m2Equipment.querySelector('[data-m2-souvenir-count]').textContent =
      m2Souvenirs.size ? m2Souvenirs.size + ' รายการ' : 'ยังไม่มี';
  }

  m2SouvenirForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = m2SouvenirInput.value.trim();
    if (!name) return;
    if (!m2Souvenirs.has(name)) m2Souvenirs.set(name, 1);
    m2SouvenirInput.value = '';
    renderM2Souvenirs();
  });
  renderM2Souvenirs();
  m2Editor.querySelector('[data-m2-editor-cancel]').addEventListener('click', () => m2Editor.close());
  m2SelectItem.addEventListener('click', () => {
    const visible = m2CatalogView.hidden;
    setM2CatalogVisible(visible);
    if (visible) m2CatalogSearch.focus();
  });
  m2CatalogSearch.addEventListener('input', renderM2Catalog);
  m2Form.addEventListener('input', updateM2AccessoryPrice);
  bindQuantityStepper(m2Editor, m2Quantity, updateM2AccessoryPrice);
  m2Form.addEventListener('submit', event => {
    event.preventDefault();
    const item = updateM2AccessoryPrice();
    if (!item) return;
    if (m2Editing !== m2Draft && m2Editing !== null) {
      const updatedItems = Array.from(m2Accessories, entry => entry[0] === m2Editing ? [m2Draft, item] : entry);
      m2Accessories.clear();
      updatedItems.forEach(([id, accessory]) => m2Accessories.set(id, accessory));
    } else {
      m2Accessories.set(m2Draft, item);
    }
    if (m2Editing !== null) m2Editing = m2Draft;
    renderM2Accessories();
    m2Editor.close();
  });
  m2Editor.addEventListener('close', () => {
    // Opened from the picker page: stay there and show the row's new state.
    if (m2Picker.open) {
      renderM2Picker();
      (m2PickOptions[m2Draft]?.row ?? m2PickerSearch).focus({preventScroll:true});
      return;
    }
    const edit = m2List.querySelector('[data-m2-edit="' + m2Editing + '"]');
    (edit ?? m2AddAccessory).focus();
  });
  renderM2Accessories();
  updateM2GiftCount();

  // M3: step 4. Voluntary insurance follows the sale type: required for finance, optional
  // for cash. Compulsory insurance (พ.ร.บ.) is always on.
  const m3Root = document.getElementById('pay-deposit');
  const m3State = {insurance:'no',rateSource:'percent',rateRequired:false,payRequired:false,required:{booking:0,deposit:0}};
  const m3Checked = name => m3Root.querySelector('[name="' + name + '"]:checked').value;
  const m3Company = document.getElementById('m3-company');
  const m3Booking = document.getElementById('m3-booking-value');
  const m3Feedback = m3Root.querySelector('[data-m3-feedback]');
  const m3Rate = document.getElementById('m3-rate-value');
  const m3RateAmount = document.getElementById('m3-rate-amount');
  const m3AccessoryCents = () => {
    let cents = 0;
    m2Accessories.forEach(item => { cents += m2NetCents(item); });
    return cents;
  };
  const m3Round2 = value => Math.round(value * 100) / 100;
  // Received payments, kept per card (P1): booking deposit and accessory deposit.
  const m3PayKinds = {
    booking: {label:'เงินจอง', add:'เพิ่มรายการชำระเงินจอง', edit:'แก้ไขรายการชำระเงินจอง', total:'รวมเงินจองที่ชำระ'},
    deposit: {label:'มัดจำอุปกรณ์', add:'เพิ่มรายการชำระมัดจำอุปกรณ์', edit:'แก้ไขรายการชำระมัดจำอุปกรณ์', total:'รวมมัดจำอุปกรณ์ที่ชำระ'},
  };
  const m3Methods = {cash:['เงินสด','สด'], transfer:['เงินโอน','โอน'], card:['บัตรเครดิต','บัตร'], cheque:['เช็ค','เช็ค']};
  const m3Now = () => {
    const now = new Date();
    const pad = value => String(value).padStart(2, '0');
    return [pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + (now.getFullYear() + 543), pad(now.getHours()) + ':' + pad(now.getMinutes())];
  };
  let m3PaySeq = 1;
  // Sample: the booking deposit was already received in cash; the accessory deposit is still open.
  const m3Payments = {booking:[{id:m3PaySeq++, method:'cash', date:m3Now()[0], time:m3Now()[1], cents:100000, proofs:0}], deposit:[]};
  const m3PaidCents = kind => m3Payments[kind].reduce((sum, entry) => sum + entry.cents, 0);

  function renderM3Payments(kind, active) {
    const block = m3Root.querySelector('[data-m3-pay-block="' + kind + '"]');
    block.hidden = !active;
    if (!active) return {paid:0, ok:true};
    const entries = m3Payments[kind];
    const paid = m3PaidCents(kind);
    const diff = m3State.required[kind] - paid;
    block.querySelector('[data-m3-pay-list]').replaceChildren(...entries.map(entry => {
      const [name, short] = m3Methods[entry.method];
      const row = document.createElement('li');
      row.className = 'm3-pay-row';
      const tag = document.createElement('span');
      tag.className = 'm3-pay-tag';
      tag.setAttribute('aria-hidden', 'true');
      tag.textContent = short;
      const text = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = name;
      const when = document.createElement('small');
      when.textContent = entry.date + ' | ' + entry.time;
      text.append(title, when);
      if (entry.proofs) {
        const proof = document.createElement('small');
        proof.textContent = 'หลักฐานการชำระเงิน ' + entry.proofs + ' รูป';
        text.append(proof);
      }
      const amount = document.createElement('output');
      amount.textContent = m2Money(entry.cents / 100);
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'm3-pay-edit';
      edit.dataset.m3PayEdit = entry.id;
      edit.textContent = 'แก้ไข';
      edit.setAttribute('aria-label', 'แก้ไขรายการ ' + name + ' ' + amount.textContent);
      row.append(tag, text, amount, edit);
      return row;
    }));
    block.querySelector('[data-m3-pay-none]').hidden = entries.length > 0;
    block.querySelector('[data-m3-pay-total-label]').textContent = m3PayKinds[kind].total + ' (' + entries.length + ' รายการ)';
    block.querySelector('[data-m3-pay-total-value]').textContent = m2Money(paid / 100);
    block.querySelector('[data-m3-pay-status]').textContent = diff === 0 ? 'ชำระครบแล้ว'
      : diff > 0 ? 'ยอดชำระ' + m3PayKinds[kind].label + 'ยังไม่ครบ ขาดอีก ' + m2Money(diff / 100)
      : 'ยอดชำระ' + m3PayKinds[kind].label + 'เกิน ' + m2Money(-diff / 100) + ' แก้ไขหรือลบรายการ';
    // Short of the amount is neutral until "ถัดไป" is pressed; more than the amount is always an error.
    block.dataset.state = diff === 0 ? 'ok' : diff < 0 || m3State.payRequired ? 'error' : 'pending';
    return {paid, ok: diff === 0};
  }

  function renderM3() {
    const finance = m3Checked('m3-sale') === 'finance';
    m3Root.querySelector('[data-m3-finance]').hidden = !finance;
    const insured = finance || m3State.insurance === 'yes';
    m3Root.querySelectorAll('[name="m3-insurance"]').forEach(input => {
      input.checked = (input.value === 'yes') === insured;
      input.disabled = finance && input.value === 'no';
    });
    m3Root.querySelector('[data-m3-insurance-rule]').textContent = finance ? 'ไฟแนนซ์กำหนดให้ต้องทำ' : 'ซื้อเงินสด ไม่บังคับ';
    const tag = m3Root.querySelector('[data-m3-insurance-tag]');
    tag.textContent = finance ? 'บังคับ' : 'ไม่บังคับ';
    tag.classList.toggle('m3-req', finance);
    if (m3Company.value) m3Root.querySelector('[data-m3-company-hint]').hidden = true;

    const hasBooking = m3Checked('m3-booking') === 'yes';
    m3Root.querySelector('[data-m3-booking-amount]').hidden = !hasBooking;
    const booking = hasBooking && Number.isFinite(m3Booking.valueAsNumber) ? Math.max(0, m3Booking.valueAsNumber) : 0;

    const accessoryCents = m3AccessoryCents();
    const hasAccessories = accessoryCents > 0;
    // No accessories in the booking: there is nothing to take a deposit on, so the card goes away.
    m3Root.querySelector('[data-m3-deposit-card]').hidden = !hasAccessories;
    const fold = m3Root.querySelector('[data-m3-fold]');
    fold.hidden = !finance;
    const folded = finance && fold.querySelector('input').checked;
    // Two linked boxes: sales type the percentage or the amount, and the other box is filled in.
    // rateSource is the box typed in last; its value stays as typed when the accessories change.
    // depositCents stays null while that box is empty or cannot be used.
    const fromPercent = m3State.rateSource === 'percent';
    const source = fromPercent ? m3Rate : m3RateAmount;
    const other = fromPercent ? m3RateAmount : m3Rate;
    const typed = source.value.replace(/[\s,฿%]/g, '');
    const number = /^\d+(?:\.\d+)?$/.test(typed) ? Number(typed) : NaN;
    const collects = hasAccessories && !folded;
    let depositCents = 0, rateError = '';
    if (collects) {
      depositCents = null;
      if (!typed) {
        if (m3State.rateRequired) rateError = 'กรอกเปอร์เซ็นต์หรือจำนวนเงินมัดจำ';
      } else if (Number.isNaN(number)) {
        rateError = 'กรอกเป็นตัวเลขเท่านั้น';
      } else if (fromPercent) {
        if (number > 100) rateError = 'กรอกได้ไม่เกิน 100%';
        else depositCents = Math.round(accessoryCents * number / 100);
      } else {
        const cents = Math.round(number * 100);
        if (cents > accessoryCents) rateError = 'มัดจำต้องไม่เกินราคาของแต่ง ' + m2Money(accessoryCents / 100);
        else depositCents = cents;
      }
      other.value = depositCents === null ? ''
        : fromPercent ? m2Money(depositCents / 100).slice(1) : String(m3Round2(depositCents / accessoryCents * 100));
    }
    m3Rate.disabled = folded;
    m3RateAmount.disabled = folded;
    source.setAttribute('aria-invalid', String(rateError !== ''));
    other.setAttribute('aria-invalid', 'false');
    const error = m3Root.querySelector('[data-m3-rate-error]');
    error.textContent = rateError;
    error.hidden = !rateError;
    const rateMissing = depositCents === null;
    m3Root.querySelector('[data-m3-accessory-total]').textContent = m2Money(accessoryCents / 100);
    m3Root.querySelector('[data-m3-deposit-due]').textContent = folded ? 'รวมกับเงินดาวน์' : rateMissing ? '-' : m2Money(depositCents / 100);
    m3Root.querySelector('[data-m3-due]').textContent = rateMissing ? '-' : m2Money(booking + depositCents / 100);
    const bookingCents = Math.round(booking * 100);
    m3State.required = {booking: bookingCents, deposit: depositCents ?? 0};
    const bookingPay = renderM3Payments('booking', bookingCents > 0);
    const depositPay = renderM3Payments('deposit', collects && depositCents > 0);
    m3Root.querySelector('[data-m3-paid]').textContent = m2Money((bookingPay.paid + depositPay.paid) / 100);
    return {finance, insured, rateMissing, payBlock: !bookingPay.ok ? 'booking' : !depositPay.ok ? 'deposit' : null};
  }

  m3Root.querySelector('.m3-screen').addEventListener('input', event => {
    if (event.target.name === 'm3-insurance') m3State.insurance = event.target.value;
    if (event.target === m3Rate || event.target === m3RateAmount) {
      m3State.rateSource = event.target === m3Rate ? 'percent' : 'amount';
      m3State.rateRequired = false;
    }
    m3Feedback.textContent = '';
    renderM3();
  });
  m2Equipment.addEventListener('m2-accessories-change', renderM3);
  m3Root.querySelector('[data-m3-next]').addEventListener('click', () => {
    m3State.rateRequired = true;
    m3State.payRequired = true;
    const {finance, rateMissing, payBlock} = renderM3();
    const companyMissing = finance && !m3Company.value;
    m3Root.querySelector('[data-m3-company-hint]').hidden = !companyMissing;
    if (companyMissing) m3Company.focus();
    else if (rateMissing) (m3State.rateSource === 'percent' ? m3Rate : m3RateAmount).focus();
    else if (payBlock) m3FocusPayBlock(payBlock);
    m3Feedback.textContent = companyMissing || rateMissing || payBlock ? '' : 'ตัวอย่าง: ข้อมูลครบ พร้อมไปขั้นถัดไป';
  });

  // Add or edit one received payment on a full page inside the frame.
  const m3Screen = m3Root.querySelector('.m3-screen');
  const m3PayPage = document.getElementById('m3-pay-page');
  const m3PayForm = m3PayPage.querySelector('form');
  const m3PaySheet = createFrameSheets(m3Screen)(m3PayPage);
  const m3PayDate = document.getElementById('m3-pay-date');
  const m3PayTime = document.getElementById('m3-pay-time');
  const m3PayAmount = document.getElementById('m3-pay-amount');
  const m3PayQuery = selector => m3PayPage.querySelector(selector);
  let m3Draft = null;

  function m3FocusPayBlock(kind, id) {
    const block = m3Root.querySelector('[data-m3-pay-block="' + kind + '"]');
    const target = (id && block.querySelector('[data-m3-pay-edit="' + id + '"]'))
      ?? block.querySelector('[data-m3-pay-add]:not([hidden])') ?? block.querySelector('[data-m3-pay-edit]');
    if (!target) return;
    target.scrollIntoView({block:'nearest'});
    target.focus({preventScroll:true});
  }

  function m3SetPayError(selector, input, message) {
    const node = m3PayQuery(selector);
    if (message !== undefined && message !== '') node.textContent = message;
    node.hidden = !message;
    input?.setAttribute('aria-invalid', String(Boolean(message)));
  }

  function renderM3PayPage() {
    const cash = m3PayForm.elements['m3-pay-method'].value === 'cash';
    m3PayQuery('[data-m3-proof-required]').hidden = cash;
    m3PayQuery('[data-m3-proof-count]').textContent = m3Draft.proofs;
    m3PayQuery('[data-m3-proof-add]').hidden = m3Draft.proofs >= 5;
    m3PayQuery('[data-m3-proofs]').replaceChildren(...Array.from({length: m3Draft.proofs}, (unused, index) => {
      const item = document.createElement('li');
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.dataset.m3ProofRemove = '';
      remove.textContent = 'ลบ';
      remove.setAttribute('aria-label', 'ลบรูปที่ ' + (index + 1));
      item.append('รูปที่ ' + (index + 1), remove);
      return item;
    }));
    if (cash || m3Draft.proofs > 0) m3SetPayError('[data-m3-proof-error]', null, '');
  }

  function openM3Pay(kind, id) {
    const entry = m3Payments[kind].find(item => item.id === id);
    const [date, time] = m3Now();
    // limit: the amount that makes the card total match exactly. It is a suggestion, not a cap:
    // the card itself reports a total that is short or over.
    const limit = m3State.required[kind] - m3PaidCents(kind) + (entry ? entry.cents : 0);
    m3Draft = {kind, id: entry ? entry.id : null, proofs: entry ? entry.proofs : 0, limit};
    m3PayQuery('#m3-pay-title').textContent = m3PayKinds[kind][entry ? 'edit' : 'add'];
    m3PayForm.elements['m3-pay-method'].value = entry ? entry.method : 'cash';
    m3PayDate.value = entry ? entry.date : date;
    m3PayTime.value = entry ? entry.time : time;
    m3PayAmount.value = entry ? String(entry.cents / 100) : limit > 0 ? String(limit / 100) : '';
    m3PayQuery('[data-m3-pay-hint]').textContent = limit > 0
      ? (entry ? 'รายการนี้ต้องเป็น ' : 'ยอด' + m3PayKinds[kind].label + 'ที่ยังขาด ') + m2Money(limit / 100) + (entry ? ' ยอดรวมจึงจะพอดี' : '')
      : 'รับชำระ' + m3PayKinds[kind].label + 'ครบแล้ว ถ้าเพิ่มรายการนี้ ต้องแก้รายการอื่นให้ยอดรวมพอดี';
    m3PayQuery('[data-m3-pay-delete]').hidden = !entry;
    m3SetPayError('[data-m3-pay-date-error]', m3PayDate, '');
    m3SetPayError('[data-m3-pay-time-error]', m3PayTime, '');
    m3SetPayError('[data-m3-pay-amount-error]', m3PayAmount, '');
    m3SetPayError('[data-m3-proof-error]', null, '');
    renderM3PayPage();
    m3PaySheet.open(m3PayQuery('[name="m3-pay-method"]:checked'));
  }

  m3Screen.addEventListener('click', event => {
    const add = event.target.closest('[data-m3-pay-add]');
    const edit = event.target.closest('[data-m3-pay-edit]');
    if (!add && !edit) return;
    const kind = (add ?? edit).closest('[data-m3-pay-block]').dataset.m3PayBlock;
    openM3Pay(kind, edit ? Number(edit.dataset.m3PayEdit) : null);
  });
  m3PayForm.addEventListener('input', event => {
    if (event.target.name === 'm3-pay-method') renderM3PayPage();
    if (event.target === m3PayDate) m3SetPayError('[data-m3-pay-date-error]', m3PayDate, '');
    if (event.target === m3PayTime) m3SetPayError('[data-m3-pay-time-error]', m3PayTime, '');
    if (event.target === m3PayAmount) m3SetPayError('[data-m3-pay-amount-error]', m3PayAmount, '');
  });
  m3PayQuery('[data-m3-proof-add]').addEventListener('click', () => {
    m3Draft.proofs++;
    renderM3PayPage();
    (m3PayQuery('[data-m3-proof-add]:not([hidden])') ?? m3PayQuery('[data-m3-proof-remove]')).focus({preventScroll:true});
  });
  m3PayQuery('[data-m3-proofs]').addEventListener('click', event => {
    if (!event.target.closest('[data-m3-proof-remove]')) return;
    m3Draft.proofs--;
    renderM3PayPage();
    m3PayQuery('[data-m3-proof-add]').focus({preventScroll:true});
  });
  m3PayQuery('[data-m3-pay-close]').addEventListener('click', () => m3PayPage.close());
  m3PayQuery('[data-m3-pay-delete]').addEventListener('click', () => {
    const {kind, id} = m3Draft;
    m3Payments[kind] = m3Payments[kind].filter(entry => entry.id !== id);
    m3Draft.id = null;
    renderM3();
    m3PayPage.close();
  });
  m3PayForm.addEventListener('submit', event => {
    event.preventDefault();
    const method = m3PayForm.elements['m3-pay-method'].value;
    const cents = Math.round(m3PayAmount.valueAsNumber * 100);
    const dateMissing = !m3PayDate.value.trim();
    const timeMissing = !m3PayTime.value.trim();
    const amountError = !Number.isFinite(cents) || cents <= 0 ? 'กรอกจำนวนเงินมากกว่า 0' : '';
    const proofMissing = method !== 'cash' && m3Draft.proofs === 0;
    m3SetPayError('[data-m3-pay-date-error]', m3PayDate, dateMissing ? 'กรอกวันที่ชำระ' : '');
    m3SetPayError('[data-m3-pay-time-error]', m3PayTime, timeMissing ? 'กรอกเวลาที่ชำระ' : '');
    m3SetPayError('[data-m3-pay-amount-error]', m3PayAmount, amountError);
    m3SetPayError('[data-m3-proof-error]', null, proofMissing ? 'แนบหลักฐานอย่างน้อย 1 รูป' : '');
    const invalid = dateMissing ? m3PayDate : timeMissing ? m3PayTime : amountError ? m3PayAmount : proofMissing ? m3PayQuery('[data-m3-proof-add]') : null;
    if (invalid) { invalid.focus(); return; }
    const values = {method, date: m3PayDate.value.trim(), time: m3PayTime.value.trim(), cents, proofs: m3Draft.proofs};
    const existing = m3Payments[m3Draft.kind].find(entry => entry.id === m3Draft.id);
    if (existing) Object.assign(existing, values);
    else {
      m3Draft.id = m3PaySeq++;
      m3Payments[m3Draft.kind].push({id: m3Draft.id, ...values});
    }
    renderM3();
    m3PayPage.close();
  });
  // The close event arrives a task later, so the lists are already redrawn; only focus is left.
  m3PayPage.addEventListener('close', () => {
    m3Feedback.textContent = '';
    m3FocusPayBlock(m3Draft.kind, m3Draft.id);
  });
  renderM3();
</script>
</body>
</html>
